version: 2.1

jobs:
  validate:
    docker:
      - image: swift:6.4.0-noble
      - image: postgres:16
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
    resource_class: medium+
    working_directory: ~/project
    environment:
      WHITETHROATED_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - run:
          name: Install system dependencies
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              curl \
              git \
              libpq-dev \
              pkg-config \
              postgresql-client \
              zlib1g-dev
            rm -rf /var/lib/apt/lists/*

      - checkout

      - run:
          name: Swift version
          command: swift --version

      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
                exit 0
              fi
              sleep 1
            done

            echo "PostgreSQL did not become ready in time." >&2
            exit 1

      - restore_cache:
          keys:
            - swiftpm-v1-6.4.0-{{ checksum "Package.resolved" }}
            - swiftpm-v1-6.4.0-

      - run:
          name: Resolve pinned dependencies
          command: swift package resolve

      - save_cache:
          key: swiftpm-v1-6.4.0-{{ checksum "Package.resolved" }}
          paths:
            - .build/checkouts
            - .build/repositories

      - run:
          name: Test release build
          command: swift test -c release
          no_output_timeout: 20m

      - run:
          name: Smoke diagnostic benchmark harness
          command: |
            WHITETHROATED_CORE_BENCHMARK=1 \
            WHITETHROATED_CORE_ITERATIONS=10000 \
            WHITETHROATED_ROUTER_CORE_BENCHMARK=1 \
            WHITETHROATED_ROUTER_CORE_ITERATIONS=10000 \
            WHITETHROATED_MIDDLEWARE_BENCHMARK=1 \
            WHITETHROATED_MIDDLEWARE_ITERATIONS=10000 \
            WHITETHROATED_TRANSPORT_BENCHMARK=1 \
            WHITETHROATED_TRANSPORT_ITERATIONS=50000 \
            swift test -c release --filter CoreBenchmarkTests
          no_output_timeout: 20m

      - run:
          name: Smoke HTTP/1 pipeline diagnostic
          command: |
            WHITETHROATED_HTTP1_BENCHMARK=1 \
            WHITETHROATED_HTTP1_ITERATIONS=1000 \
            swift test -c release \
              --filter RuntimeServerPipelineTests/testHTTP1PipelineBenchmark
          no_output_timeout: 20m

      - run:
          name: Build example
          command: swift build -c release --product whitethroated-example

      - run:
          name: Build deployment example
          command: swift build -c release --product whitethroated-deployment-example

      - run:
          name: Smoke deployment example
          command: |
            set -eu
            
            port=3100
            log=/tmp/whitethroated-deployment-example.log
            
            WHITETHROATED_HOST=127.0.0.1 \
            WHITETHROATED_PORT="$port" \
            WHITETHROATED_DRAIN_TIMEOUT_SECONDS=5 \
              .build/release/whitethroated-deployment-example \
              >"$log" 2>&1 &
            pid=$!
            
            cleanup() {
              if kill -0 "$pid" 2>/dev/null; then
                kill -KILL "$pid" 2>/dev/null || true
              fi
              wait "$pid" 2>/dev/null || true
            }
            trap cleanup EXIT HUP INT TERM
            
            ready=""
            for attempt in $(seq 1 30); do
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$log"
                exit 1
              fi
            
              if ready="$(curl --fail --silent --show-error --max-time 2 \
                "http://127.0.0.1:$port/ready")"; then
                break
              fi
            
              sleep 1
            done
            
            if [ "$ready" != "ready" ]; then
              echo "Deployment example did not become ready." >&2
              cat "$log"
              exit 1
            fi
            
            health="$(curl --fail --silent --show-error --max-time 2 \
              "http://127.0.0.1:$port/health")"
            if [ "$health" != "ok" ]; then
              echo "Unexpected health response: $health" >&2
              exit 1
            fi
            
            root="$(curl --fail --silent --show-error --max-time 2 \
              "http://127.0.0.1:$port/")"
            if [ "$root" != "Hello from WhiteThroated" ]; then
              echo "Unexpected root response: $root" >&2
              exit 1
            fi
            
            kill -TERM "$pid"
            
            (
              sleep 20
            
              if kill -0 "$pid" 2>/dev/null; then
                kill -KILL "$pid" 2>/dev/null || true
              fi
            ) &
            watchdog=$!
            
            status=0
            wait "$pid" || status=$?
            
            kill "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
            
            if [ "$status" -ne 0 ]; then
              echo "Deployment example did not exit cleanly after SIGTERM." >&2
              cat "$log"
              exit 1
            fi
            
            trap - EXIT HUP INT TERM

      - run:
          name: Build migration CLI
          command: swift build -c release --product whitethroated-migrate

      - run:
          name: Build WhiteThroated benchmark server
          command: swift build -c release --product whitethroated-benchmark-server

      - run:
          name: Build raw NIO benchmark server
          command: swift build -c release --product raw-nio-benchmark-server

      - run:
          name: Build WhiteThroated runtime benchmark server
          command: swift build -c release --product whitethroated-runtime-benchmark-server

      - run:
          name: Build Swift benchmark client
          command: swift build -c release --product whitethroated-benchmark-client

      - run:
          name: Build WebSocket benchmark server
          command: swift build -c release --product whitethroated-websocket-benchmark-server

      - run:
          name: Build WebSocket benchmark client
          command: swift build -c release --product whitethroated-websocket-benchmark-client

      - run:
          name: Build Swift benchmark merger
          command: swift build -c release --product whitethroated-benchmark-merge

      - run:
          name: Build Swift A/B comparator
          command: swift build -c release --product whitethroated-benchmark-ab-compare

      - run:
          name: Build Swift topology campaign runner
          command: swift build -c release --product whitethroated-benchmark-campaign

      - run:
          name: Smoke interleaved response-stream A/B harness
          command: |
            set -eu

            output=/tmp/whitethroated-response-stream-campaign-smoke
            rm -rf "$output"

            WHITETHROATED_CAMPAIGN_PROFILE=response-stream \
            WHITETHROATED_CAMPAIGN_SMOKE=1 \
            WHITETHROATED_CAMPAIGN_AB_PEER_ROOT="$PWD" \
            WHITETHROATED_CAMPAIGN_OUTPUT="$output" \
              .build/release/whitethroated-benchmark-campaign

            test -f "$output/baseline/COMPLETE.txt"
            test -f "$output/candidate/COMPLETE.txt"
            test -f "$output/PAIRED_COMPLETE.txt"
            grep -q "SMOKE ONLY" "$output/baseline/COMPLETE.txt"
            grep -q "SMOKE ONLY" "$output/candidate/COMPLETE.txt"
            grep -q "SMOKE ONLY" "$output/PAIRED_COMPLETE.txt"
          no_output_timeout: 20m

workflows:
  ci:
    when: pipeline.event.name == "pull_request" or pipeline.git.branch == "main"
    jobs:
      - validate
