name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift:
          - "5.10-jammy"
          - "6.0-noble"

    container:
      image: swift:${{ matrix.swift }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test release build
        run: swift test -c release

      - name: Build example
        run: swift build -c release --product hudhud-example

      - name: Build benchmark server
        run: swift build -c release --product hudhud-benchmark-server
