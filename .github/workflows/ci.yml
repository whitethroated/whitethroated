name: CI

# Automatic GitHub-hosted execution is temporarily disabled while the account
# is blocked by GitHub Actions usage/billing limits. CircleCI mirrors this
# validation automatically. Keep this workflow for manual parity validation
# after GitHub-hosted capacity becomes available again.
on:
  workflow_dispatch:

jobs:
  test:
    name: Swift 6.4.0
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.0-noble

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends curl libpq-dev pkg-config zlib1g-dev

      - name: Swift version
        run: swift --version

      - name: Resolve pinned dependencies
        run: swift package resolve

      - name: Test release build
        env:
          WHITETHROATED_POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
        run: swift test -c release

      - name: Smoke diagnostic benchmark harness
        env:
          WHITETHROATED_CORE_BENCHMARK: "1"
          WHITETHROATED_CORE_ITERATIONS: "10000"
          WHITETHROATED_ROUTER_CORE_BENCHMARK: "1"
          WHITETHROATED_ROUTER_CORE_ITERATIONS: "10000"
          WHITETHROATED_MIDDLEWARE_BENCHMARK: "1"
          WHITETHROATED_MIDDLEWARE_ITERATIONS: "10000"
          WHITETHROATED_TRANSPORT_BENCHMARK: "1"
          WHITETHROATED_TRANSPORT_ITERATIONS: "50000"
        run: swift test -c release --filter CoreBenchmarkTests

      - name: Smoke HTTP/1 pipeline diagnostic
        env:
          WHITETHROATED_HTTP1_BENCHMARK: "1"
          WHITETHROATED_HTTP1_ITERATIONS: "1000"
        run: swift test -c release --filter RuntimeServerPipelineTests/testHTTP1PipelineBenchmark

      - name: Build example
        run: swift build -c release --product whitethroated-example

      - name: Build deployment example
        run: swift build -c release --product whitethroated-deployment-example

      - name: Smoke deployment example
        run: |
          set -eu
          
          port=3100
          log=/tmp/whitethroated-deployment-example.log
          
          WHITETHROATED_HOST=127.0.0.1 \
          WHITETHROATED_PORT="$port" \
          WHITETHROATED_DRAIN_TIMEOUT_SECONDS=5 \
            .build/release/whitethroated-deployment-example \
            >"$log" 2>&1 &
          pid=$!
          
          cleanup() {
            if kill -0 "$pid" 2>/dev/null; then
              kill -KILL "$pid" 2>/dev/null || true
            fi
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT HUP INT TERM
          
          ready=""
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
          
            if ready="$(curl --fail --silent --show-error --max-time 2 \
              "http://127.0.0.1:$port/ready")"; then
              break
            fi
          
            sleep 1
          done
          
          if [ "$ready" != "ready" ]; then
            echo "Deployment example did not become ready." >&2
            cat "$log"
            exit 1
          fi
          
          health="$(curl --fail --silent --show-error --max-time 2 \
            "http://127.0.0.1:$port/health")"
          if [ "$health" != "ok" ]; then
            echo "Unexpected health response: $health" >&2
            exit 1
          fi
          
          root="$(curl --fail --silent --show-error --max-time 2 \
            "http://127.0.0.1:$port/")"
          if [ "$root" != "Hello from WhiteThroated" ]; then
            echo "Unexpected root response: $root" >&2
            exit 1
          fi
          
          kill -TERM "$pid"
          
          for attempt in $(seq 1 20); do
            if ! kill -0 "$pid" 2>/dev/null; then
              if wait "$pid"; then
                trap - EXIT HUP INT TERM
                exit 0
              fi
          
              echo "Deployment example exited with a failure status." >&2
              cat "$log"
              exit 1
            fi
          
            sleep 1
          done
          
          echo "Deployment example did not exit after SIGTERM." >&2
          cat "$log"
          exit 1

      - name: Build migration CLI
        run: swift build -c release --product whitethroated-migrate

      - name: Build WhiteThroated benchmark server
        run: swift build -c release --product whitethroated-benchmark-server

      - name: Build raw NIO benchmark server
        run: swift build -c release --product raw-nio-benchmark-server

      - name: Build WhiteThroated runtime benchmark server
        run: swift build -c release --product whitethroated-runtime-benchmark-server

      - name: Build Swift benchmark client
        run: swift build -c release --product whitethroated-benchmark-client

      - name: Build WebSocket benchmark server
        run: swift build -c release --product whitethroated-websocket-benchmark-server

      - name: Build WebSocket benchmark client
        run: swift build -c release --product whitethroated-websocket-benchmark-client

      - name: Build Swift benchmark merger
        run: swift build -c release --product whitethroated-benchmark-merge

      - name: Build Swift topology campaign runner
        run: swift build -c release --product whitethroated-benchmark-campaign
